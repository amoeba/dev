        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
<% endif %>

<% if lang == "go" %>
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          check-latest: true
          go-version: "stable"
<% elif lang == "rust" %>
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c  # v1.15.2
        with:
          components: "clippy"
<% endif %>

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
        with:
          pixi-version: v0.50.2
          run-install: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: "drivers-*"
          path: "~/drivers"

      - name: Install tools
        working-directory: <{ lang_subdir }>
        run: |
<% if lang == "go" %>
          # XXX: can't install go-licenses under go 1.25
          # https://github.com/google/go-licenses/issues/312
          git clone --depth=1 https://github.com/google/go-licenses
          git config --global --add 'url.https://github.com/.insteadOf' ssh://git@github.com/
          pushd go-licenses
          go get -u
          # Silent break: https://github.com/spf13/cobra/pull/2303
          # Manually edit the go.mod to get around this for now
          sed -i 's|github.com/spf13/pflag v1.0.8|github.com/spf13/pflag v1.0.7|g' go.mod
          go mod tidy
          go install .
          popd
<% elif lang == "rust" %>
<% endif %>

      - name: Generate packages
        working-directory: <{ lang_subdir }>
        run: |
          pixi install

          pixi run adbc-gen-package \
            --name <{driver}> \
            --root $(pwd) \
            --manifest-template manifest.toml \
            ${{ (inputs.release && '--release') || '' }}\
            -o ~/packages \
            ~/drivers/drivers-*-*/

          ls ~/packages

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: all-packages
          path: ~/packages
          retention-days: 7

  release:
<% if release %>
    name: "Release"
<% else %>
    name: "Release (Dry Run)"
<% endif %>
    runs-on: ubuntu-latest
    needs:
      - package
      - validate
    permissions:
<% if release %>
      contents: write
<% else %>
      contents: read
<% endif %>

    steps:
<% if release or not secrets["all"] %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
<% else %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "checkout remote"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
<% endif %>

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          check-latest: true
          go-version: "stable"

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
        with:
          pixi-version: v0.50.2
          run-install: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: "all-packages"
          path: "~/packages"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: "docs"
          path: "~/packages"

<% if release %>
      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: go
        run: |
          ref=${{ github.ref }}
          tag=${ref#"refs/tags/"}

          pixi run release $(pwd) $tag
          gh release upload $tag $(find ~/packages -name '*.tar.gz') $(find ~/packages -name 'manifest.yaml') $(find ~/packages -name '*.md')

      - name: Release (dry-run)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: go
        run: |
          git tag go/v1000.0.0
          tag=go/v1000.0.0

          pixi run release --dry-run $(pwd) $tag
          echo gh release upload $tag $(find ~/packages -name '*.tar.gz') $(find ~/packages -name 'manifest.yaml') $(find ~/packages -name '*.md')
<% else %>
      - name: Release (dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: go
        run: |
          git tag <{ lang_subdir }>/v1000.0.0
          tag=<{ lang_subdir }>/v1000.0.0

          pixi run release --dry-run $(pwd) $tag
          echo gh release upload $tag $(find ~/packages -name '*.tar.gz') $(find ~/packages -name 'manifest.yaml') $(find ~/packages -name '*.md')
<% endif %>
