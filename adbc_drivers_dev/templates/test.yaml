# !!!! AUTO-GENERATED FILE.  DO NOT EDIT. !!!!
# USE adbc-gen-workflow (see adbc-drivers/dev) TO UPDATE THIS FILE.

# This is a common workflow for building & testing drivers:
#
# - Build the driver
# - Start dependencies
# - Run tests
# - Build the shared library

name: <{lang_human}> <{workflow_name}>

on:
  pull_request:
    branches:
      - main
    paths:
<% if not release %>
      - "<{lang_subdir}>/**"
<% endif %>
<% for path in pull_request_trigger_paths %>
      - <{path}>
<% endfor %>

  push:
<% if release %>
    tags:
      - "<{lang_subdir}>/v**"
<% else %>
    branches:
      - main
    paths:
      - "<{lang_subdir}>/**"
<% for path in pull_request_trigger_paths %>
      - <{path}>
<% endfor %>
<% endif %>

<% if not release and secrets["all"] %>
  workflow_call:
    inputs:
      repository:
        description: "The repository to checkout (in owner/repo short format)"
        required: true
        type: string
      ref:
        description: "The ref to checkout"
        required: true
        type: string
    secrets:
<% for name, val in secrets["all"].items() %>
      <{val}>:
        required: true
<% endfor %>
<% endif %>
<% if release %>
  workflow_dispatch: {}
<% endif %>

concurrency:
  # Must share concurrency group with release workflow since it also builds/tests
  group: ${{ github.repository }}-${{ github.ref }}-ci
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: "Test/${{ matrix.platform }}_${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux, arch: amd64, runner: ubuntu-latest }
          - { platform: macos, arch: arm64, runner: macos-latest }
          - { platform: win, arch: amd64, runner: windows-latest }
<% if environment %>
    environment: <{environment}>
<% endif %>
    permissions:
      contents: read
<% if permissions.get("id_token") %>
      id-token: write
<% endif %>
    steps:
      - name: free up disk space
        if: runner.os != 'Windows'
        run: |
          # Preinstalled tools use a lot of disk space, free up some space
          # https://github.com/actions/runner-images/issues/2840
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

<% if release or not secrets["all"] %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
<% else %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "checkout remote"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
<% endif %>

<% if lang == "go" %>
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          cache-dependency-path: go/go.sum
          check-latest: true
          go-version-file: go/go.mod
<% elif lang == "rust" %>
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c  # v1.15.2
        with:
          components: "clippy"
<% endif %>

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
        with:
          pixi-version: v0.50.2
          run-install: false

<% if aws %>
      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5.1.1
        with:
          aws-region: <{aws.region}>
          role-to-assume: ${{ secrets.aws_role }}
          role-session-name: ${{ secrets.aws_role_session_name }}
<% endif %>
<% if gcloud %>
      - name: Google Cloud Login
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          service_account: ${{ secrets.gcloud_service_account }}
          workload_identity_provider: ${{ secrets.gcloud_workload_identity_provider }}
<% endif %>

      - name: Build
<% if secrets["build:test"] %>
        env:
<% for name, val in secrets["build:test"].items() %>
          <{name}>: ${{ secrets.<{val}> }}
<% endfor %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          if [[ -f ci/scripts/pre-build.sh ]]; then
            echo "Loading pre-build"
            ./ci/scripts/pre-build.sh test ${{ matrix.platform }} ${{ matrix.arch }}
          fi

<% if lang == "go" %>
          go build ./...
<% elif lang == "rust" %>
          cargo build --locked
<% else %>
<{not_implemented(lang)}>
<% endif %>

      - name: Start Test Dependencies
        # Can't use Docker on macOS AArch64 runners, and Windows containers
        # work but often the container doesn't support Windows
        if: runner.os == 'Linux'
        working-directory: <{ lang_subdir }>
        run: |
          if [[ -f compose.yaml ]]; then
            if ! docker compose up --detach --wait test-service; then
              echo "Service failed to start"
              echo "Logs:"
              docker compose logs test-service
              exit 1
            fi
          fi

      - name: Test
        if: runner.os == 'Linux'
<% if secrets["test"] %>
        env:
<% for name, val in secrets["test"].items() %>
          <{name}>: ${{ secrets.<{val}> }}
<% endfor %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          set -a
          if [[ -f .env ]]; then
            source .env
          fi
          if [[ -f .env.ci ]]; then
            source .env.ci
          fi
          set +a

          if [[ -f ci/scripts/pre-test.sh ]]; then
            echo "Loading pre-test"
            ./ci/scripts/pre-test.sh
          fi

<% if lang == "go" %>
          go test -tags assert -v ./...
<% elif lang == "rust" %>
          cargo test
<% else %>
<{not_implemented(lang)}>
<% endif %>

          if [[ -f ci/scripts/post-test.sh ]]; then
            ./ci/scripts/post-test.sh
          fi

<% if lang == "go" %>
      - name: go mod tidy
        if: runner.os == 'Linux'
        working-directory: <{ lang_subdir }>
        run: |
          go mod tidy --diff
<% endif %>

      - name: Test
        if: runner.os != 'Linux'
        working-directory: <{ lang_subdir }>
        run: |
<% if lang == "go" %>
          go test -tags assert -v ./...
<% elif lang == "rust" %>
          cargo test
<% else %>
<{not_implemented(lang)}>
<% endif %>

  validate:
    name: "Validate/${{ matrix.platform }}_${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # I think we only need to test one platform, but we can change that later
          - { platform: linux, arch: amd64, runner: ubuntu-latest }
<% if environment %>
    environment: <{environment}>
<% endif %>
    permissions:
      contents: read
<% if permissions.get("id_token") %>
      id-token: write
<% endif %>
    steps:
      - name: free up disk space
        if: runner.os != 'Windows'
        run: |
          # Preinstalled tools use a lot of disk space, free up some space
          # https://github.com/actions/runner-images/issues/2840
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

<% if release or not secrets["all"] %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
<% else %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "checkout remote"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
<% endif %>

<% if lang == "go" %>
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          cache-dependency-path: go/go.sum
          check-latest: true
          go-version-file: go/go.mod
<% elif lang == "rust" %>
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c  # v1.15.2
        with:
          components: "clippy"
<% endif %>

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
        with:
          pixi-version: v0.50.2
          run-install: false

<% if aws %>
      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5.1.1
        with:
          aws-region: <{aws.region}>
          role-to-assume: ${{ secrets.aws_role }}
          role-session-name: ${{ secrets.aws_role_session_name }}
<% endif %>
<% if gcloud %>
      - name: Google Cloud Login
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          service_account: ${{ secrets.gcloud_service_account }}
          workload_identity_provider: ${{ secrets.gcloud_workload_identity_provider }}
<% endif %>

      - name: Build Library
<% if secrets["build:test"] %>
        env:
<% for name, val in secrets["build:test"].items() %>
          <{name}>: ${{ secrets.<{val}> }}
<% endfor %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          if [[ -f ci/scripts/pre-build.sh ]]; then
            ./ci/scripts/pre-build.sh test ${{ matrix.platform }} ${{ matrix.arch }}
          fi
          set -a
          if [[ -f .env.release ]]; then
            source .env.test
          fi
          set +a
          pixi run adbc-make build DEBUG=true VERBOSE=true DRIVER=<{driver}> IMPL_LANG=<{lang}> <{' '.join(lang_config.build.additional_make_args) }>

      - name: Start Test Dependencies
        # Can't use Docker on macOS AArch64 runners, and Windows containers
        # work but often the container doesn't support Windows
        if: runner.os == 'Linux'
        working-directory: <{ lang_subdir }>
        run: |
          if [[ -f compose.yaml ]]; then
            if ! docker compose up --detach --wait test-service; then
              echo "Service failed to start"
              echo "Logs:"
              docker compose logs test-service
              exit 1
            fi
          fi

      - name: Validate
        if: runner.os == 'Linux'
<% if secrets["validate"] %>
        env:
<% for name, val in secrets["validate"].items() %>
          <{name}>: ${{ secrets.<{val}> }}
<% endfor %>
<% endif %>
        working-directory: <{ lang_subdir }>
        run: |
          set -a
          if [[ -f .env ]]; then
            source .env
          fi
          if [[ -f .env.ci ]]; then
            source .env.ci
          fi
          set +a

          if [[ -f ci/scripts/pre-test.sh ]]; then
            echo "Loading pre-test"
            ./ci/scripts/pre-test.sh
          fi

          docker ps
          pixi run validate

          if [[ -f ci/scripts/post-test.sh ]]; then
            ./ci/scripts/post-test.sh
          fi

      - name: Generate docs
        working-directory: <{ lang_subdir }>
        run: |
          pixi run gendocs --output generated

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: docs
          path: "<{ lang_subdir }>/generated/<{driver}>.md"
          retention-days: 2

  build:
    name: "Build <{driver}>/${{ matrix.platform }}_${{ matrix.arch }}"
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux, arch: amd64, runner: ubuntu-latest }
<% if private %>
          - { platform: linux, arch: arm64, runner: private-ubuntu-24.04-arm }
<% else %>
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
<% endif %>
          - { platform: macos, arch: arm64, runner: macos-latest }
          - { platform: windows, arch: amd64, runner: windows-latest }
    permissions:
      contents: read
      packages: read

    steps:
<% if release or not secrets["all"] %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
<% else %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "checkout remote"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
<% endif %>

<% if lang == "go" %>
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          cache-dependency-path: go/go.sum
          check-latest: true
          go-version-file: go/go.mod
<% elif lang == "rust" %>
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c  # v1.15.2
        with:
          components: "clippy"
<% endif %>

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7  # v0.9.3
        with:
          pixi-version: v0.50.2
          run-install: false

      - name: Install dev tools
        working-directory: <{ lang_subdir }>
        run: |
          pixi install

      - name: Log in to ghcr.io
        if: runner.os == 'Linux'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Library
        working-directory: <{ lang_subdir }>
<% if secrets["build:release"] %>
        env:
<% for name, val in secrets["build:release"].items() %>
          <{name}>: ${{ secrets.<{val}> }}
<% endfor %>
<% endif %>
        run: |
          if [[ -f ci/scripts/pre-build.sh ]]; then
            ./ci/scripts/pre-build.sh release ${{ matrix.platform }} ${{ matrix.arch }}
          fi
          set -a
          if [[ -f .env.release ]]; then
            source .env.release
          fi
          set +a
          pixi run adbc-make check CI=true VERBOSE=true DRIVER=<{driver}> IMPL_LANG=<{lang}> <{' '.join(lang_config.build.additional_make_args) }>

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: drivers-${{ matrix.platform }}-${{ matrix.arch }}
          path: "<{ lang_subdir }>/build/libadbc_driver_<{driver}>.*"
          retention-days: 2

  package:
    name: "Generate Packages"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
<% if release or not secrets["all"] %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
<% else %>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "checkout remote"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
