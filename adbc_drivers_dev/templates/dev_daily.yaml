# This is a common workflow synchronizing workflows in driver repositories. Note
# that this workflow can't update itself due to GitHub's permissions model so
# updates to instances of this workflow need to be updated by hand.

name: Dev (Daily)

on:
  schedule:
    - cron: 14 23 * * *

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sync_workflows:
    name: Sync Workflows
    runs-on: ubuntu-slim
    if: github.repository_owner == 'adbc-drivers'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: true # for git operations below

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b  # 7.2.0.

      - name: Re-generate workflows
        run: |
          echo "Generating workflows with adbc-gen-workflow..."
          uvx --from git+https://github.com/adbc-drivers/dev.git adbc-gen-workflow generate $(pwd) || {
            echo "ERROR: Failed to generate workflows"
            exit 1
          }

          echo "Workflow generation completed successfully"

      - name: Create PR if there are any changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            PR_TITLE="chore: update generated workflows"
            BRANCH="chore/workflows_$(date +%Y-%m-%d)"

            # Skip if branch already exists on remote
            if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
              echo "Branch $BRANCH already exists on remote. Skipping creating a new PR."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"

            # Add all workflow files first
            git add .github/workflows/

            # GitHub blocks workflows from updating themselves, meaning we can't
            # update dev_daily.yaml from itself. Restore dev_daily if needed.
            if git diff --cached --name-only | grep -q "dev_daily.yaml"; then
              echo "Excluding dev_daily.yaml from commit (workflows cannot modify themselves)"
              git restore --staged .github/workflows/dev_daily.yaml || true
            fi

            git commit -m "update generated workflows"
            git push origin "$BRANCH"

            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "" || {
                echo "ERROR: Failed to create pull request"
                exit 1
              }
          else
            echo "No changes to commit. Skipping creating a PR."
          fi
